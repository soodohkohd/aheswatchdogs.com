<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Canonicalize to the apex domain BEFORE anything else loads. www. and the
       bare domain are separate origins, so CORS (API allows only the apex) and
       the per-origin login session would otherwise behave inconsistently.
       Keep this in sync with the API ALLOWED_ORIGIN / OAuth origins. -->
  <script>
    (function () {
      if (location.hostname === 'www.aheswatchdogs.com') {
        location.replace('https://aheswatchdogs.com' + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <title>AHES Watch D.O.G.S.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Antelope Hills Elementary School Watch D.O.G.S. — program info, volunteer sign-up, and guidelines for serving on campus.">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://aheswatchdogs.com/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Open Graph (LinkedIn, Facebook, iMessage, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AHES Watch D.O.G.S.">
  <meta property="og:title" content="AHES Watch D.O.G.S.">
  <meta property="og:description" content="Antelope Hills Elementary School Watch D.O.G.S. — program info, volunteer sign-up, and guidelines for serving on campus.">
  <meta property="og:url" content="https://aheswatchdogs.com/">
</head>
<body>
  <app-root></app-root>
</body>
</html>
